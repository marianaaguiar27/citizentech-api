spring:
  application:
    name: citizentech-api
  datasource:
    url: "jdbc:h2:mem:citizentech;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  cache:
    type: caffeine
    cache-names: regioes,riscoRegiao,alertasAtivos,estatisticasOcorrencias
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m,recordStats

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
  info:
    env:
      enabled: true

info:
  app:
    name: CitizenTech API
    description: API de monitoramento de riscos para comunidades vulneráveis
    version: 1.0.0

# Segredo do JWT vem de variável de ambiente (nunca commitar chave real)
app:
  jwt:
    secret: ${JWT_SECRET:troque-esta-chave-em-producao-minimo-32-caracteres}
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*